[project]
name = "lpmap"
version = "0.1.0"
description = "Ingest public SEC filings (Form D first) into the OpenSource LP Map database"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
lpmap = "lpmap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
